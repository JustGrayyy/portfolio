<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>website is currently being built.....</title>
  <meta name="description" content="An interactive 2D manga sketchbook under-construction page with an interactive Umaru-style anime chibi character.">

  <!-- Google Fonts: Hand-drawn manga lettering, display, & bold architectural drafting font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Subtle Manga Halftone & Sketch Paper Texture Layer -->
  <div class="manga-paper-texture" aria-hidden="true"></div>

  <!-- Main 2D Manga Stage -->
  <main class="manga-stage" id="manga-stage">
    <!-- Centered Manga Narration Title Card -->
    <header class="manga-title-card" id="title-card">
      <div class="title-pin top-left" aria-hidden="true"></div>
      <div class="title-pin top-right" aria-hidden="true"></div>
      <div class="title-corner-screentone" aria-hidden="true"></div>
      <h1 class="manga-headline">
        <span class="headline-text">website is currently being built</span><span class="animated-dots" aria-hidden="true"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
      </h1>
    </header>

    <!-- Unfinished Fading Handle in Background (@ryanc / @ryancuizon) -->
    <div class="manga-draft-handle" id="draft-handle" aria-hidden="true">
      <div class="draft-watermark">
        <span class="handle-solid">@ryanc</span><span class="draft-cursor" aria-hidden="true"></span><span class="handle-unfinished"><span class="fading-char char-u">u</span><span class="fading-char char-i">i</span><span class="fading-char char-z">z</span><span class="fading-char char-o">o</span><span class="fading-char char-n">n</span></span>
      </div>
    </div>

    <!-- 60fps Full-Screen Manga Ink FX Canvas (Action bursts, speedlines, onomatopoeia, dust) -->
    <canvas id="fx-canvas"></canvas>

    <!-- Interactive 2D Umaru-Style Chibi Character Actor -->
    <div class="chibi-actor state-idle" id="chibi-actor" role="button" tabindex="0" aria-label="Interactive chibi character. Hit with cursor or click to interact.">
      <!-- Comic Speech Bubble -->
      <div class="chibi-speech-bubble" id="chibi-speech" aria-live="polite">
        <span class="speech-text" id="speech-text">zZz...</span>
        <div class="speech-tail" aria-hidden="true"></div>
      </div>

      <!-- SVG Rigged 2D Character -->
      <svg class="chibi-svg-root" id="chibi-svg" viewBox="0 0 220 220" width="220" height="220" fill="none">
        <defs>
          <!-- Authentic Manga Halftone Screentone Pattern (Dots) -->
          <pattern id="screentone-dots" width="6" height="6" patternUnits="userSpaceOnUse">
            <circle cx="3" cy="3" r="1.1" fill="#141413" opacity="0.18"/>
          </pattern>

          <!-- Authentic Manga Cross-Hatch Pattern -->
          <pattern id="screentone-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
            <line x1="0" y1="8" x2="8" y2="0" stroke="#141413" stroke-width="0.8" opacity="0.22"/>
          </pattern>

          <!-- Soft Ink Shadow Gradient -->
          <radialGradient id="shadow-gradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#141413" stop-opacity="0.28"/>
            <stop offset="65%" stop-color="#141413" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Floor Drop Shadow (Scales with jump height) -->
        <ellipse id="chibi-shadow" cx="110" cy="208" rx="54" ry="10" fill="url(#shadow-gradient)"/>

        <!-- Root Transform Group for Squash, Stretch & Tilt -->
        <g id="chibi-squash-root" transform-origin="110 200">

          <!-- ================= 1. FRONT POSE (Umaru-chan Front View) ================= -->
          <g id="chibi-front-pose" class="chibi-pose">
            <!-- Hamster Hooded Cape (Umaru-chan's Iconic Hood in Manga Black & White) -->
            <g id="chibi-cape-group">
              <!-- Hamster Ears -->
              <g id="chibi-ears">
                <!-- Left Ear -->
                <g id="hood-ear-left" class="hood-ear" transform-origin="58 32">
                  <path d="M42 46 C36 28, 52 14, 68 28 C74 34, 72 44, 68 48 Z" fill="#ffffff" stroke="#141413" stroke-width="3.2" stroke-linejoin="round"/>
                  <path d="M48 42 C44 32, 54 22, 64 32 C66 36, 64 42, 60 44 Z" fill="#e8e4dc" stroke="#141413" stroke-width="1.8"/>
                </g>
                <!-- Right Ear -->
                <g id="hood-ear-right" class="hood-ear" transform-origin="162 32">
                  <path d="M178 46 C184 28, 168 14, 152 28 C146 34, 148 44, 152 48 Z" fill="#ffffff" stroke="#141413" stroke-width="3.2" stroke-linejoin="round"/>
                  <path d="M172 42 C176 32, 166 22, 156 32 C154 36, 156 42, 160 44 Z" fill="#e8e4dc" stroke="#141413" stroke-width="1.8"/>
                </g>
              </g>

              <!-- Hamster Cape Back Folds & Volume (Umaru Bean Shape) -->
              <path id="hood-cloak-back" d="M46 92 C28 128, 34 182, 52 195 C74 204, 146 204, 168 195 C186 182, 192 128, 174 92 Z" fill="#ffffff" stroke="#141413" stroke-width="3.2" stroke-linejoin="round"/>
              <!-- Cloak Shading screentone -->
              <path d="M46 92 C28 128, 34 182, 52 195 C74 204, 146 204, 168 195 C186 182, 192 128, 174 92 Z" fill="url(#screentone-dots)"/>
              <!-- Cape Fold Creases -->
              <path d="M60 170 Q70 190 85 194" stroke="#141413" stroke-width="2.2" stroke-linecap="round" fill="none"/>
              <path d="M160 170 Q150 190 135 194" stroke="#141413" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            </g>

            <!-- Stubby Feet Peeking Under Cape -->
            <g id="chibi-feet-group">
              <ellipse id="chibi-foot-left" cx="86" cy="198" rx="13" ry="8" fill="#ffffff" stroke="#141413" stroke-width="2.8"/>
              <ellipse id="chibi-foot-right" cx="134" cy="198" rx="13" ry="8" fill="#ffffff" stroke="#141413" stroke-width="2.8"/>
            </g>

            <!-- Hamster Hood Head Enclosure & Face Opening -->
            <g id="chibi-head-hood">
              <!-- Large Round Hood Rim -->
              <path d="M42 94 C38 42, 74 20, 110 20 C146 20, 182 42, 178 94 C176 138, 144 154, 110 154 C76 154, 44 138, 42 94 Z" fill="#ffffff" stroke="#141413" stroke-width="3.5" stroke-linejoin="round"/>
              <!-- Hood Top Screentone Accent -->
              <path d="M52 50 C70 30, 150 30, 168 50 C146 38, 74 38, 52 50 Z" fill="url(#screentone-dots)"/>

              <!-- Hamster Face on Top of Hood (Crucial Umaru-chan Feature!) -->
              <g id="hood-hamster-face">
                <!-- Left Hamster Eye -->
                <circle cx="92" cy="46" r="3.4" fill="#141413"/>
                <circle cx="91" cy="45" r="1.1" fill="#ffffff"/>
                <!-- Right Hamster Eye -->
                <circle cx="128" cy="46" r="3.4" fill="#141413"/>
                <circle cx="127" cy="45" r="1.1" fill="#ffffff"/>
                <!-- Hamster Nose / Snout -->
                <polygon points="110,48 107,52 113,52" fill="#141413"/>
                <!-- Hamster Cheeks (Manga screentone blush) -->
                <ellipse cx="83" cy="49" rx="4.5" ry="3" fill="#e8e4dc" stroke="#141413" stroke-width="0.8"/>
                <ellipse cx="137" cy="49" rx="4.5" ry="3" fill="#e8e4dc" stroke="#141413" stroke-width="0.8"/>
                <!-- Hamster Mouth (ω) -->
                <path d="M107 53 Q110 56 113 53" stroke="#141413" stroke-width="1.6" stroke-linecap="round" fill="none"/>
              </g>

              <!-- Hood Interior Opening (Frames face) -->
              <ellipse cx="110" cy="108" rx="54" ry="43" fill="#141413"/>
              <ellipse cx="110" cy="108" rx="52" ry="41" fill="#faf8f5"/>

              <!-- White Inner Shirt / Romper Collar -->
              <path d="M85 146 Q110 162 135 146 Q128 178 110 182 Q92 178 85 146 Z" fill="#ffffff" stroke="#141413" stroke-width="2.4"/>
              <!-- Zipper line -->
              <line x1="110" y1="152" x2="110" y2="180" stroke="#141413" stroke-width="1.8" stroke-dasharray="2 2"/>

              <!-- Cute Neck Ribbon / Clasp -->
              <g id="hood-clasp" transform="translate(110, 150)">
                <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#141413" stroke-width="2.4"/>
                <path d="M-4 2 L-10 9 L-1 6 Z" fill="#ffffff" stroke="#141413" stroke-width="1.8"/>
                <path d="M4 2 L10 9 L1 6 Z" fill="#ffffff" stroke="#141413" stroke-width="1.8"/>
              </g>
            </g>

            <!-- Hair (Manga Black & White Blonde Sheen) -->

              <!-- Left Side Flowing Hair Lock -->
              <path d="M60 106 C50 126, 44 154, 48 180 C54 182, 60 176, 62 164 C64 150, 68 135, 72 118 Z" fill="#ffffff" stroke="#141413" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M60 106 C50 126, 44 154, 48 180 C54 182, 60 176, 62 164 C64 150, 68 135, 72 118 Z" fill="url(#screentone-dots)"/>
              <!-- Right Side Flowing Hair Lock -->
              <path d="M160 106 C170 126, 176 154, 172 180 C166 182, 160 176, 158 164 C156 150, 152 135, 148 118 Z" fill="#ffffff" stroke="#141413" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M160 106 C170 126, 176 154, 172 180 C166 182, 160 176, 158 164 C156 150, 152 135, 148 118 Z" fill="url(#screentone-dots)"/>

              <!-- Anime Hair Bangs Peeking Out of Hood -->
              <g id="chibi-hair-bangs">
                <!-- Center Bang -->
                <path d="M96 74 Q110 98 112 96 Q116 86 126 74 Z" fill="#ffffff" stroke="#141413" stroke-width="2.4" stroke-linejoin="round"/>
                <!-- Left Bang -->
                <path d="M72 82 Q84 104 90 99 Q94 88 100 76 Z" fill="#ffffff" stroke="#141413" stroke-width="2.4" stroke-linejoin="round"/>
                <!-- Right Bang -->
                <path d="M148 82 Q136 104 130 99 Q126 88 120 76 Z" fill="#ffffff" stroke="#141413" stroke-width="2.4" stroke-linejoin="round"/>
                <!-- Hair Highlights (Manga ink sheen) -->

                <path d="M128 84 Q136 89 132 92" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Construction Safety Hardhat (Pure B&W Manga Edition) -->
            <g id="chibi-hardhat" transform-origin="110 24">
              <!-- Helmet Dome -->
              <path d="M76 28 C74 12, 90 4, 110 4 C130 4, 146 12, 144 28 Z" fill="#ffffff" stroke="#141413" stroke-width="3" stroke-linejoin="round"/>

              <path d="M72 28 C90 32, 130 32, 148 28 C144 32, 128 35, 110 35 C92 35, 76 32, 72 28 Z" fill="#e8e4dc" stroke="#141413" stroke-width="2.4" stroke-linejoin="round"/>
              <!-- Solid Black Safety Cross Emblem (+) -->
              <rect x="107" y="11" width="6" height="14" fill="#141413"/>
              <rect x="103" y="15" width="14" height="6" fill="#141413"/>
              <!-- Helmet Gloss Highlight -->
              <path d="M84 14 C90 9, 102 7, 106 7" stroke="#141413" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <!-- Chin Strap -->
              <path d="M77 28 Q73 70 88 120" stroke="#141413" stroke-width="1.4" stroke-dasharray="2 2" fill="none"/>
            </g>

            <!-- Face Group (Cheeks, Eyes, Mouth) -->
            <g id="chibi-face-group">
              <!-- Authentic Manga Blush Marks (///) on Cheeks (No pink fill) -->
              <g id="chibi-blush" class="blush-marks">
                <!-- Left Cheek -->
                <line x1="70" y1="118" x2="76" y2="124" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <line x1="75" y1="117" x2="81" y2="123" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <line x1="80" y1="118" x2="86" y2="124" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <!-- Right Cheek -->
                <line x1="138" y1="118" x2="144" y2="124" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <line x1="143" y1="117" x2="149" y2="123" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <line x1="148" y1="118" x2="154" y2="124" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
              </g>

              <!-- ================= SWITCHABLE EYE EXPRESSIONS ================= -->
              <g id="chibi-eyes-container">
                <!-- 1. Default Sparkly Umaru Anime Eyes -->
                <g class="eye-state active" id="eyes-default">
                  <!-- Left Eye -->
                  <ellipse cx="84" cy="108" rx="10" ry="13" fill="#141413"/>
                  <ellipse cx="84" cy="113" rx="7" ry="6" fill="#e8e4dc"/>
                  <ellipse cx="84" cy="113" rx="7" ry="6" fill="url(#screentone-dots)"/>
                  <circle cx="81" cy="103" r="4.2" fill="#ffffff"/>
                  <circle cx="87" cy="114" r="2.2" fill="#ffffff"/>
                  <circle cx="83" cy="118" r="1.2" fill="#ffffff"/>
                  <path d="M72 100 Q84 93 96 100" stroke="#141413" stroke-width="3.4" stroke-linecap="round" fill="none"/>

                  <!-- Right Eye -->
                  <ellipse cx="136" cy="108" rx="10" ry="13" fill="#141413"/>
                  <ellipse cx="136" cy="113" rx="7" ry="6" fill="#e8e4dc"/>
                  <ellipse cx="136" cy="113" rx="7" ry="6" fill="url(#screentone-dots)"/>
                  <circle cx="133" cy="103" r="4.2" fill="#ffffff"/>
                  <circle cx="139" cy="114" r="2.2" fill="#ffffff"/>
                  <circle cx="135" cy="118" r="1.2" fill="#ffffff"/>
                  <path d="M124 100 Q136 93 148 100" stroke="#141413" stroke-width="3.4" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 2. Happy Arcs (^ ^) -->
                <g class="eye-state" id="eyes-happy">
                  <path d="M74 110 Q84 97 94 110" stroke="#141413" stroke-width="3.6" stroke-linecap="round" fill="none"/>
                  <path d="M126 110 Q136 97 146 110" stroke="#141413" stroke-width="3.6" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 3. Bonked / Squeezed Pain (> <) with Anime Tears -->
                <g class="eye-state" id="eyes-bonked">
                  <path d="M74 102 L86 110 L74 118" stroke="#141413" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  <path d="M146 102 L134 110 L146 118" stroke="#141413" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  <path d="M68 114 C64 118, 64 124, 69 124 C73 124, 73 118, 68 114 Z" fill="#141413"/>
                  <path d="M152 114 C156 118, 156 124, 151 124 C147 124, 147 118, 152 114 Z" fill="#141413"/>
                </g>

                <!-- 4. Dizzy Spirals (@ @) -->
                <g class="eye-state" id="eyes-dizzy">
                  <path d="M84 108 m -9 0 a 9 9 0 1 0 18 0 a 6 6 0 1 0 -12 0 a 3 3 0 1 0 6 0" stroke="#141413" stroke-width="2.6" stroke-linecap="round" fill="none"/>
                  <path d="M136 108 m -9 0 a 9 9 0 1 0 18 0 a 6 6 0 1 0 -12 0 a 3 3 0 1 0 6 0" stroke="#141413" stroke-width="2.6" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 5. Angry Pout / Glare (¬ ¬) -->
                <g class="eye-state" id="eyes-pout">
                  <line x1="74" y1="102" x2="94" y2="107" stroke="#141413" stroke-width="3.8" stroke-linecap="round"/>
                  <ellipse cx="84" cy="111" rx="7" ry="5" fill="#141413"/>
                  <line x1="146" y1="102" x2="126" y2="107" stroke="#141413" stroke-width="3.8" stroke-linecap="round"/>
                  <ellipse cx="136" cy="111" rx="7" ry="5" fill="#141413"/>
                </g>

                <!-- 6. Shocked / Blank Dots (• •) -->
                <g class="eye-state" id="eyes-blank">
                  <circle cx="84" cy="108" r="4.2" fill="#141413"/>
                  <circle cx="136" cy="108" r="4.2" fill="#141413"/>
                </g>
              </g>

              <!-- ================= SWITCHABLE MOUTH EXPRESSIONS ================= -->
              <g id="chibi-mouth-container">
                <!-- 1. Cat Mouth (:3 / ω) -->
                <g class="mouth-state active" id="mouth-cat">
                  <path d="M103 126 Q107 131 110 128 Q113 131 117 126" stroke="#141413" stroke-width="2.6" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 2. Happy Open Mouth (D) -->
                <g class="mouth-state" id="mouth-open">
                  <path d="M103 124 Q110 122 117 124 Q110 137 103 124 Z" fill="#141413" stroke="#141413" stroke-width="2.2" stroke-linejoin="round"/>
                  <path d="M106 128 Q110 134 114 128 Z" fill="#e8e4dc"/>

                <!-- 3. Wavy Dizzy Mouth (~) -->

                  <path d="M102 127 Q106 123 110 127 Q114 131 118 127" stroke="#141413" stroke-width="2.4" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 4. Pout Triangle Mouth (▲) -->
                <g class="mouth-state" id="mouth-pout">
                  <path d="M106 129 L110 124 L114 129 Z" fill="#141413" stroke="#141413" stroke-width="2" stroke-linejoin="round"/>
                </g>
              </g>

              <!-- Manga Anger Vein (💢) on Hood Temple -->
              <g id="manga-anger-vein" class="anger-vein" transform="translate(150, 48) scale(0.9)" opacity="0">
                <path d="M-6 -6 Q0 -2 6 -6 Q2 0 6 6 Q0 2 -6 6 Q-2 0 -6 -6 Z" fill="#141413" stroke="#141413" stroke-width="1.8"/>
                <line x1="-5" y1="0" x2="5" y2="0" stroke="#faf8f5" stroke-width="1.6"/>
                <line x1="0" y1="-5" x2="0" y2="5" stroke="#faf8f5" stroke-width="1.6"/>
              </g>

              <!-- Manga Sweat Drop (💧) Beside Face -->

                <path d="M0 -12 C-6 -4 -6 6 0 8 C6 6 6 -4 0 -12 Z" fill="#ffffff" stroke="#141413" stroke-width="2.4" stroke-linejoin="round"/>
                <line x1="-1" y1="-4" x2="-1" y2="4" stroke="#141413" stroke-width="1.4" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Stubby Arms & Craftsman Mallet -->
            <g id="chibi-arms-group">
              <!-- Left Arm (Holding the block / steadying) -->
              <g id="chibi-arm-left" class="chibi-arm" transform-origin="54 148">
                <path d="M54 142 C38 144, 32 158, 42 170 C52 178, 66 170, 62 154 Z" fill="#ffffff" stroke="#141413" stroke-width="2.8" stroke-linejoin="round"/>
              </g>

              <!-- Right Arm (Holding Builder's Mallet for Rhythmic Hammering!) -->

                <!-- Mallet Attached to Hand (B&W Wood) -->

                  <rect x="-3" y="-22" width="6" height="34" rx="2" fill="#ffffff" stroke="#141413" stroke-width="2"/>
                  <!-- Mallet Head -->
                  <rect x="-14" y="-30" width="28" height="15" rx="3" fill="#e8e4dc" stroke="#141413" stroke-width="2.6"/>
                  <!-- Mallet End Cap Accent -->
                  <line x1="-14" y1="-22" x2="14" y2="-22" stroke="#141413" stroke-width="1.4"/>

              </g>
            </g>
          </g>

          <!-- ================= 2. BACK POSE (Umaru-chan Turning at Back & Building!) ================= -->

            </g>

            <!-- Hood Cloak Back (Large Bean Silhouette Seen From Rear) -->

              <!-- Screentone Depth on Cloak Back -->

              <path d="M156 165 Q140 185 124 190" stroke="#141413" stroke-width="2" stroke-linecap="round" fill="none"/>

              <!-- Iconic Umaru Hamster Ball Tail on Lower Back! -->

              <path d="M176 44 C182 28, 166 16, 152 28 C148 32, 150 42, 154 46 Z" fill="#ffffff" stroke="#141413" stroke-width="3.2" stroke-linejoin="round"/>

              <!-- Peek-Back Face Profile (Looking back over shoulder while building) -->

                <path d="M152 74 C168 80, 175 98, 168 114 C162 124, 150 128, 140 126" fill="#faf8f5" stroke="#141413" stroke-width="3" stroke-linejoin="round"/>

                <!-- Sparkle pupil -->
                <circle cx="158" cy="92" r="3.2" fill="#141413"/>

                <!-- Cheek Blush Hash Lines /// -->
                <line x1="152" y1="104" x2="157" y2="109" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <line x1="156" y1="103" x2="161" y2="108" stroke="#141413" stroke-width="2" stroke-linecap="round"/>
                <!-- Happy Cat Mouth :3 -->
                <path d="M148 114 Q153 118 158 114" stroke="#141413" stroke-width="2.2" stroke-linecap="round" fill="none"/>

            <!-- Rear View of Hardhat (Knob, rim, straps) -->
